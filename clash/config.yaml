# 规则指向
rules:
  # ========== Microsoft Teams → 美国节点（GitHub 规则集 teams_us，每日自动更新）==========
  - RULE-SET,teams_us,美国
  # ========== 手写自定义规则（GitHub 规则集 custom_*）==========
  - RULE-SET,custom_direct,DIRECT
  - RULE-SET,custom_fallback,兜底
  - RULE-SET,reject_non_ip,拦截
  - RULE-SET,reject_domainset,拦截
  - RULE-SET,reject_ip,拦截
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,拦截
  - RULE-SET,sogouinput,拦截
  - RULE-SET,cdn_domainset,兜底
  - RULE-SET,cdn_non_ip,兜底
  - RULE-SET,steam_direct,DIRECT
  - RULE-SET,game_cdn_direct,DIRECT
  - RULE-SET,stream_non_ip,兜底
  - RULE-SET,stream_ip,兜底
  - RULE-SET,ai_non_ip,AI
  - RULE-SET,telegram_non_ip,电报
  - RULE-SET,telegram_ip,电报
  - RULE-SET,apple_cdn,苹果
  - RULE-SET,apple_services,苹果
  - RULE-SET,apple_cn_non_ip,苹果
  - RULE-SET,microsoft_cdn_non_ip,苹果
  - RULE-SET,microsoft_non_ip,苹果
  - RULE-SET,download_domainset,苹果
  - RULE-SET,download_non_ip,苹果
  - RULE-SET,neteasemusic_non_ip,网易云
