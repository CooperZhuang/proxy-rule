# 计量网络（iPhone 热点 / 指定 SSID）下未命中以上规则的流量走低倍节点 —— Surge 原生 SCRIPT 规则。
# 默认关闭：这条规则位于末端，会对所有未命中流量逐条执行 JS（实测冷启 248ms / 热 5.6ms），
# 与"迁移后不能更差"冲突。需要时取消下面一行注释即可，脚本已在 [Script] 段定义好。
# SCRIPT,ssid-rule,🪫 低倍节点
