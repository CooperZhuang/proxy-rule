ca-passphrase = {{CA_PASS}}
hostname = -*.icloud.com.cn, -client-api.oray.com, -client-api-v2.oray.com, -slapi.oray.net, -*.oray.com, -*.oray.net, m.360buyimg.com
skip-server-cert-verify = false
h2 = true
auto-quic-block = true