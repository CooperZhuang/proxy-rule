# ===== 5. 兜底 =====
# Surge 特有：计量网络（iPhone 热点 / 指定 SSID）下未命中以上规则的流量走低倍节点
SCRIPT,ssid-rule,低倍节点
FINAL,兜底

[URL Rewrite]
